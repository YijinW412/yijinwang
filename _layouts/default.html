<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" href="{{ site.logo | relative_url }}">
  </head>
  <body>
    <main class="page">

      <header class="masthead">
        {% if site.logo %}
        <img class="masthead__portrait"
             src="{{ site.logo | relative_url }}"
             alt="Portrait of {{ site.title }}"
             width="96" height="96">
        {% endif %}
        <div class="masthead__id">
          <h1 class="masthead__name">{{ site.title }}</h1>
          {% if site.role %}<p class="masthead__line">{{ site.role }}</p>{% endif %}
          {% if site.affiliation %}<p class="masthead__line masthead__line--quiet">{{ site.affiliation }}{% if site.pronouns %} · {{ site.pronouns }}{% endif %}</p>{% endif %}
        </div>
      </header>

      {{ content }}

      <footer class="colophon">
        <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
      </footer>

    </main>
  </body>
</html>
