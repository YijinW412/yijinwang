# --- Site identity -----------------------------------------------------------
title: Yijin Wang

# Plain text only. Goes into <meta name="description"> and the Google snippet,
# where any HTML would be escaped and show up as literal &lt;br&gt;.
description: "PhD candidate in Behavior, Cognition and Neuroscience at American University, studying how the human brain perceives materials."

url: "https://YijinW412.github.io"
baseurl: ""

# --- Masthead ----------------------------------------------------------------
# The three lines under the name. Edit these rather than the layout.
logo: /img/portfolio.jpg
role: "PhD Candidate · Behavior, Cognition and Neuroscience"
affiliation: "American University · Washington, DC"
pronouns: "She/Her"

# --- Build -------------------------------------------------------------------
# No remote_theme: the layout in _layouts/ and the stylesheet in assets/css/
# are self-contained, so nothing is inherited from an upstream theme.
plugins:
  - jekyll-seo-tag

# GitHub Pages turns this on by default; it would override the page title with
# the first <h1> on the page ("About" instead of "Yijin Wang").
titles_from_headings:
  enabled: false

sass:
  style: compressed

exclude:
  - README.md
  - .gitignore
